<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Apartados</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F5F0; --surface: #FFFFFF; --surface2: #F0EDE7;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --text: #1A1815; --text-muted: #6B6760; --text-faint: #A8A5A0;
    --accent: #1A5CA8; --accent-light: #E6F1FB; --accent-text: #0C447C;
    --danger: #C0392B; --danger-light: #FCEBEB; --danger-text: #7B1C1C;
    --success: #2E7D32; --success-light: #EAF3DE; --success-text: #1A4D1C;
    --warn: #B45309; --warn-light: #FAEEDA; --warn-text: #7A3A04;
    --radius: 10px; --radius-lg: 14px;
  }
  html { font-size: 16px; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* TOPBAR */
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 6px 1.5rem; display: flex; align-items: center;
    justify-content: space-between; min-height: 58px;
    position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .title-edit-wrap { display: flex; align-items: center; gap: 5px; }
  .title-input {
    font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace;
    border: none; background: transparent; outline: none; width: 210px;
    border-bottom: 1.5px dashed var(--border-strong); padding: 2px 4px;
    transition: border-color 0.15s, color 0.15s;
  }
  .title-input:focus { border-color: var(--accent); color: var(--text); }
  .edit-icon { font-size: 13px; color: var(--text-faint); cursor: pointer; }
  .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* SYNC INDICATOR */
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ccc;
    display: inline-block; flex-shrink: 0; transition: background 0.3s;
  }
  .sync-dot.ok     { background: var(--success); }
  .sync-dot.saving { background: var(--warn); }
  .sync-dot.error  { background: var(--danger); }
  .sync-label { font-size: 12px; color: var(--text-faint); }

  /* LOADING OVERLAY */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 500; transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text-muted); }

  .main { max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 5px; }
  .stat-val { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; font-family: 'DM Mono', monospace; }
  .stat-val.red   { color: var(--danger); }
  .stat-val.green { color: var(--success); }
  .stat-val.money { font-size: 18px; color: var(--warn); }

  /* FORM */
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
  .form-heading { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 1rem; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .fg { display: flex; flex-direction: column; gap: 4px; }
  .fg.full  { grid-column: 1 / -1; }
  .fg.span2 { grid-column: span 2; }
  .fg label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .fg input, .fg textarea {
    padding: 8px 10px; border: 1px solid var(--border-strong);
    border-radius: var(--radius); font-size: 14px;
    font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .fg input:focus, .fg textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,92,168,0.1); }
  .fg textarea { resize: vertical; min-height: 60px; }
  .price-hint { font-size: 11px; color: var(--accent-text); margin-top: 3px; min-height: 16px; font-weight: 500; }

  /* AUTOCOMPLETE */
  .autocomplete-wrap { position: relative; }
  .autocomplete-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius); z-index: 300; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: none;
    max-height: 280px; overflow-y: auto;
  }
  .autocomplete-list.open { display: block; }
  .ac-item {
    padding: 9px 12px; font-size: 13px; cursor: pointer; color: var(--text);
    transition: background 0.1s; border-bottom: 0.5px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.selected { background: var(--accent-light); color: var(--accent-text); }
  .ac-name  { flex: 1; }
  .ac-code  { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-faint); background: var(--surface2); padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-right: 6px; }
  .ac-price { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .ac-item:hover .ac-code, .ac-item.selected .ac-code   { background: rgba(26,92,168,0.12); color: var(--accent-text); }
  .ac-item:hover .ac-price, .ac-item.selected .ac-price { color: var(--accent-text); }
  .ac-highlight { font-weight: 700; }

  /* BUTTONS */
  .btn-primary {
    padding: 9px 20px; background: var(--accent); color: white;
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 1rem;
    display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .btn-primary:hover { background: #154E90; }
  .btn-ghost {
    padding: 8px 14px; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s;
  }
  .btn-ghost:hover { background: var(--surface2); }

  /* FILTERS */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .section-title  { font-size: 15px; font-weight: 600; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filt { padding: 4px 14px; border-radius: 100px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; font-weight: 500; }
  .filt.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* ORDERS */
  .orders { display: flex; flex-direction: column; gap: 9px; margin-bottom: 1.5rem; }
  .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.9rem 1.1rem; display: flex; gap: 12px; align-items: flex-start; transition: opacity 0.2s; }
  .order-card.done { opacity: 0.45; }
  .chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-strong); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .chk.active { background: var(--success); border-color: var(--success); }
  .chk svg { display: none; }
  .chk.active svg { display: block; }
  .order-body { flex: 1; min-width: 0; }
  .order-top  { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .order-producto { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .order-codigo   { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-faint); background: var(--surface2); padding: 1px 6px; border-radius: 4px; margin-left: 5px; font-weight: 400; }
  .order-card.done .order-producto { text-decoration: line-through; color: var(--text-faint); }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 100px; white-space: nowrap; }
  .tag-hora   { background: var(--accent-light);   color: var(--accent-text);  }
  .tag-pago   { background: var(--danger-light);   color: var(--danger-text);  }
  .tag-pagado { background: var(--success-light);  color: var(--success-text); }
  .order-info  { font-size: 13px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .order-notes { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-style: italic; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 17px; padding: 2px 4px; border-radius: 6px; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
  .del-btn:hover { color: var(--danger); background: var(--danger-light); }

  /* PENDIENTES */
  .pendientes-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
  .pendientes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 9px; margin-top: 1rem; }
  .pchip { background: var(--bg); border-radius: var(--radius); padding: 10px 14px; border: 1px solid var(--border); }
  .pchip-name { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; line-height: 1.3; }
  .pchip-num  { font-size: 24px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text); }
  .pchip-num.cero { color: var(--success); }

  .empty { text-align: center; padding: 2.5rem; color: var(--text-faint); font-size: 14px; }

  /* MODALS */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.75rem; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal h3  { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .modal p   { font-size: 14px; color: var(--text-muted); margin-bottom: 1.25rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Conectando con Firebase…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">Control de Apartados</span>
    <div class="title-edit-wrap">
      <input class="title-input" id="titulo-control" type="text" value="10 de mayo de 2026"
        oninput="guardarTitulo()" placeholder="Nombre del control…" title="Toca para editar" />
      <span class="edit-icon" onclick="document.getElementById('titulo-control').focus()">✏️</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="sync-dot" id="sync-dot"></span>
    <span class="sync-label" id="sync-label">Conectando…</span>
    <button class="btn-ghost" onclick="exportarCSV()">Exportar CSV</button>
    <button class="btn-ghost" onclick="document.getElementById('modal-borrar').classList.add('open')">Borrar todo</button>
  </div>
</div>

<div class="main">
  <div class="stats-grid" id="stats-grid"></div>

  <div class="form-section">
    <div class="form-heading">+ Nuevo apartado</div>
    <div class="form-grid">
      <div class="fg span2">
        <label>Producto / código</label>
        <div class="autocomplete-wrap">
          <input id="f-producto" type="text" placeholder="Ej: ESFRME, RODA, IN150…" autocomplete="off"
            oninput="acInput(this)" onkeydown="acKey(event)" onblur="setTimeout(()=>acClose(),160)" />
          <div class="autocomplete-list" id="ac-list"></div>
        </div>
        <div class="price-hint" id="price-hint"></div>
      </div>
      <div class="fg">
        <label>Hora de recolección</label>
        <input id="f-hora" type="time" />
      </div>
      <div class="fg span2">
        <label>Nombre del cliente</label>
        <input id="f-nombre" type="text" placeholder="Nombre completo" />
      </div>
      <div class="fg">
        <label>Teléfono</label>
        <input id="f-telefono" type="tel" placeholder="10 dígitos" />
      </div>
      <div class="fg">
        <label>Pago restante ($)</label>
        <input id="f-pago" type="number" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="fg full">
        <label>Notas extras</label>
        <textarea id="f-notas" placeholder="Dedicatoria, sabor, alergias…"></textarea>
      </div>
    </div>
    <button class="btn-primary" onclick="agregarPedido()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      Agregar apartado
    </button>
  </div>

  <div class="section-header">
    <span class="section-title">Apartados</span>
    <div class="filters">
      <button class="filt active" data-f="todos"      onclick="setFiltro(this)">Todos</button>
      <button class="filt"        data-f="pendientes" onclick="setFiltro(this)">Pendientes</button>
      <button class="filt"        data-f="entregados" onclick="setFiltro(this)">Entregados</button>
    </div>
  </div>

  <div class="orders" id="orders-list"></div>

  <div class="pendientes-section">
    <div class="section-title">Pendientes por producto</div>
    <div class="pendientes-grid" id="pendientes-grid"></div>
  </div>
</div>

<div class="modal-bg" id="modal-borrar">
  <div class="modal">
    <h3>¿Borrar todos los apartados?</h3>
    <p>Se eliminarán todos los registros en todos los dispositivos. Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="document.getElementById('modal-borrar').classList.remove('open')">Cancelar</button>
      <button class="btn-primary" style="background:#C0392B;margin-top:0" onclick="borrarTodo()">Sí, borrar todo</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase config ───────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyD6FFHq7GMe_VdAuEFzj1A1RvNQ0pVoGtY",
  authDomain:        "apartados-pasteleria.firebaseapp.com",
  databaseURL:       "https://apartados-pasteleria-default-rtdb.firebaseio.com",
  projectId:         "apartados-pasteleria",
  storageBucket:     "apartados-pasteleria.firebasestorage.app",
  messagingSenderId: "725607229153",
  appId:             "1:725607229153:web:7d3b2c33eab8cb1402b9a0"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── Refs ──────────────────────────────────────────────────────────────────────
// Each "event" is stored under /eventos/<titulo_slug>/
// so different dates don't overwrite each other.
function slugTitulo() {
  return (document.getElementById('titulo-control').value || 'control')
    .toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}
function dbRef()       { return ref(db, `eventos/${slugTitulo()}/pedidos`); }
function dbTituloRef() { return ref(db, `eventos/${slugTitulo()}/titulo`);  }

// ── State ─────────────────────────────────────────────────────────────────────
let pedidos   = [];
let nextId    = 1;
let filtro    = 'todos';
let unsubscribe = null;

// ── Sync status ───────────────────────────────────────────────────────────────
function setSyncStatus(status) {
  const dot   = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  dot.className = 'sync-dot ' + status;
  label.textContent = status === 'ok' ? 'Sincronizado' : status === 'saving' ? 'Guardando…' : 'Sin conexión';
}

// ── Listen to Firebase ────────────────────────────────────────────────────────
function subscribeToDB() {
  if (unsubscribe) unsubscribe();
  unsubscribe = onValue(dbRef(), (snapshot) => {
    const data = snapshot.val();
    pedidos = data ? Object.values(data) : DATOS_INICIALES.map(p => ({...p}));
    // If DB was empty, seed it
    if (!data) saveAll();
    nextId = Math.max(...pedidos.map(p => p.id), 0) + 1;
    setSyncStatus('ok');
    document.getElementById('loading-overlay').classList.add('hidden');
    renderAll();
  }, (error) => {
    console.error(error);
    setSyncStatus('error');
    document.getElementById('loading-overlay').classList.add('hidden');
  });
}

// ── Save helpers ──────────────────────────────────────────────────────────────
function saveAll() {
  setSyncStatus('saving');
  const obj = {};
  pedidos.forEach(p => { obj['p' + p.id] = p; });
  set(dbRef(), obj).then(() => setSyncStatus('ok')).catch(() => setSyncStatus('error'));
}

function savePedido(p) {
  setSyncStatus('saving');
  set(ref(db, `eventos/${slugTitulo()}/pedidos/p${p.id}`), p)
    .then(() => setSyncStatus('ok')).catch(() => setSyncStatus('error'));
}

function deletePedido(id) {
  setSyncStatus('saving');
  remove(ref(db, `eventos/${slugTitulo()}/pedidos/p${id}`))
    .then(() => setSyncStatus('ok')).catch(() => setSyncStatus('error'));
}

// ── Title ─────────────────────────────────────────────────────────────────────
window.guardarTitulo = function() {
  const val = document.getElementById('titulo-control').value;
  localStorage.setItem('apartados_titulo_v1', val);
  // Re-subscribe to new path when title changes
  subscribeToDB();
};

// Load saved title
const savedTitulo = localStorage.getItem('apartados_titulo_v1');
if (savedTitulo) document.getElementById('titulo-control').value = savedTitulo;

// ── CATÁLOGO ──────────────────────────────────────────────────────────────────

// ── AUTOCOMPLETE ──────────────────────────────────────────────────────────────
let acIndex = -1, acResultados = [];

function getSugeridos(q) {
  if (!q) return CATALOGO_LISTA.slice(0, 18);
  const ql = q.toLowerCase();
  return CATALOGO_LISTA.filter(p => p.busqueda.includes(ql)).slice(0, 18);
}

window.acInput = function(input) {
  acIndex = -1;
  const q    = input.value.trim();
  acResultados = getSugeridos(q);
  const list = document.getElementById('ac-list');
  const hint = document.getElementById('price-hint');
  const exact= CATALOGO[q.toUpperCase()];
  if (exact) {
    hint.textContent = `✓ ${exact.nombre} — $${exact.precio.toLocaleString('es-MX')}`;
    const pEl = document.getElementById('f-pago');
    if (!pEl.value) pEl.value = exact.precio;
  } else { hint.textContent = ''; }
  if (!acResultados.length) { list.classList.remove('open'); return; }
  const ql = q.toLowerCase();
  list.innerHTML = acResultados.map((p, i) => {
    const raw = p.codigo + '  ' + p.nombre;
    const hi  = ql ? raw.replace(new RegExp(`(${ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<span class="ac-highlight">$1</span>') : raw;
    const pts = hi.split(/^(\S+)\s{2}(.*)$/);
    const cH  = pts.length > 1 ? pts[1] : esc(p.codigo);
    const nH  = pts.length > 1 ? pts[2] : esc(p.nombre);
    return `<div class="ac-item" data-i="${i}" onmousedown="acSelect(${i})">
      <span class="ac-name"><span class="ac-code">${cH}</span> ${nH}</span>
      <span class="ac-price">$${p.precio.toLocaleString('es-MX')}</span>
    </div>`;
  }).join('');
  list.classList.add('open');
};

window.acSelect = function(i) {
  const p = acResultados[i]; if (!p) return;
  document.getElementById('f-producto').value   = p.codigo;
  document.getElementById('price-hint').textContent = `✓ ${p.nombre} — $${p.precio.toLocaleString('es-MX')}`;
  const pEl = document.getElementById('f-pago');
  if (!pEl.value) pEl.value = p.precio;
  acClose();
};

window.acClose = function() { document.getElementById('ac-list').classList.remove('open'); acIndex = -1; };

window.acKey = function(e) {
  const list  = document.getElementById('ac-list');
  const items = list.querySelectorAll('.ac-item');
  if (!list.classList.contains('open')) return;
  if      (e.key==='ArrowDown')            { e.preventDefault(); acIndex=Math.min(acIndex+1,items.length-1); acHighlight(items); }
  else if (e.key==='ArrowUp')             { e.preventDefault(); acIndex=Math.max(acIndex-1,-1);              acHighlight(items); }
  else if (e.key==='Enter'&&acIndex>=0)  { e.preventDefault(); acSelect(acIndex); }
  else if (e.key==='Escape')             { acClose(); }
};

function acHighlight(items) {
  items.forEach((it,i) => it.classList.toggle('selected', i===acIndex));
  if (acIndex>=0) items[acIndex].scrollIntoView({block:'nearest'});
}

window.agregarPedido = function() {
  const raw    = document.getElementById('f-producto').value.trim();
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!raw)    { flash('f-producto'); return; }
  if (!nombre) { flash('f-nombre');   return; }
  const codigo   = raw.toUpperCase();
  const cat      = CATALOGO[codigo];
  const producto = cat ? cat.nombre : raw;
  const p = { id: nextId++, codigo, producto, nombre,
    telefono: document.getElementById('f-telefono').value.trim(),
    hora:     document.getElementById('f-hora').value,
    pago:     parseFloat(document.getElementById('f-pago').value) || 0,
    notas:    document.getElementById('f-notas').value.trim(),
    entregado: false };
  pedidos.push(p);
  savePedido(p);
  ['f-producto','f-nombre','f-telefono','f-hora','f-pago','f-notas'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('price-hint').textContent = '';
};

function flash(id) {
  const el = document.getElementById(id); el.style.borderColor = '#C0392B'; el.focus();
  setTimeout(() => el.style.borderColor = '', 1500);
}

window.toggleEntrega = function(id) {
  const p = pedidos.find(x => x.id===id);
  if (p) { p.entregado = !p.entregado; savePedido(p); }
};

window.eliminar = function(id) {
  if (!confirm('¿Eliminar este apartado?')) return;
  pedidos = pedidos.filter(x => x.id!==id);
  deletePedido(id);
};

window.borrarTodo = function() {
  setSyncStatus('saving');
  remove(dbRef()).then(() => { setSyncStatus('ok'); pedidos=[]; renderAll(); });
  document.getElementById('modal-borrar').classList.remove('open');
};

window.setFiltro = function(btn) {
  filtro = btn.dataset.f;
  document.querySelectorAll('.filt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderOrders();
};

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() { renderStats(); renderOrders(); renderPendientes(); }

function renderStats() {
  const total=pedidos.length, entregados=pedidos.filter(p=>p.entregado).length;
  const pend=total-entregados, cobro=pedidos.filter(p=>!p.entregado).reduce((s,p)=>s+p.pago,0);
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total apartados</div><div class="stat-val">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Por entregar</div><div class="stat-val red">${pend}</div></div>
    <div class="stat-card"><div class="stat-label">Entregados</div><div class="stat-val green">${entregados}</div></div>
    <div class="stat-card"><div class="stat-label">Cobro pendiente</div><div class="stat-val money">$${cobro.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>`;
}

function renderOrders() {
  const lista = pedidos.filter(p => filtro==='todos'?true:filtro==='pendientes'?!p.entregado:p.entregado);
  const sorted = [...lista].sort((a,b) => {
    if (a.entregado!==b.entregado) return a.entregado?1:-1;
    if (a.hora&&b.hora) return a.hora.localeCompare(b.hora);
    if (a.hora) return -1; if (b.hora) return 1;
    return a.id-b.id;
  });
  const el = document.getElementById('orders-list');
  if (!sorted.length) { el.innerHTML='<div class="empty">Sin apartados en esta vista</div>'; return; }
  el.innerHTML = sorted.map(p=>`
    <div class="order-card ${p.entregado?'done':''}">
      <button class="chk ${p.entregado?'active':''}" onclick="toggleEntrega(${p.id})" title="${p.entregado?'Marcar pendiente':'Marcar entregado'}">
        <svg width="14" height="14" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="order-body">
        <div class="order-top">
          <span class="order-producto">${esc(p.producto)}${p.codigo?`<span class="order-codigo">${esc(p.codigo)}</span>`:''}</span>
          <div class="tags">
            ${p.hora?`<span class="tag tag-hora">🕐 ${p.hora}</span>`:''}
            ${p.pago>0?`<span class="tag tag-pago">$${p.pago.toLocaleString('es-MX',{minimumFractionDigits:2})} restante</span>`:'<span class="tag tag-pagado">✓ Pagado</span>'}
          </div>
        </div>
        <div class="order-info">
          <span>👤 ${esc(p.nombre)}</span>
          ${p.telefono?`<span>📞 ${esc(p.telefono)}</span>`:''}
        </div>
        ${p.notas?`<div class="order-notes">📝 ${esc(p.notas)}</div>`:''}
      </div>
      <button class="del-btn" onclick="eliminar(${p.id})" title="Eliminar">✕</button>
    </div>`).join('');
}

function renderPendientes() {
  const pend=pedidos.filter(p=>!p.entregado), conteo={};
  pend.forEach(p=>{const k=p.producto.trim(); conteo[k]=(conteo[k]||0)+1;});
  const el=document.getElementById('pendientes-grid');
  const entries=Object.entries(conteo).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) { el.innerHTML='<div style="color:#A8A5A0;font-size:14px;padding:4px 0;grid-column:1/-1">🎉 ¡Todo entregado!</div>'; return; }
  el.innerHTML=entries.map(([prod,n])=>`
    <div class="pchip">
      <div class="pchip-name">${esc(prod)}</div>
      <div class="pchip-num ${n===0?'cero':''}">${n}</div>
    </div>`).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.exportarCSV = function() {
  if (!pedidos.length) { alert('No hay apartados.'); return; }
  const titulo = document.getElementById('titulo-control').value || 'apartados';
  const cols   = ['Código','Producto','Nombre','Teléfono','Hora','Pago restante','Notas','Entregado'];
  const rows   = pedidos.map(p=>[p.codigo,p.producto,p.nombre,p.telefono,p.hora,p.pago,p.notas,p.entregado?'Sí':'No']
    .map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv  = [cols.join(','),...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a    = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`apartados_${titulo.replace(/\s+/g,'_')}.csv`; a.click();
};
